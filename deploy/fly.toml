app = "countersign"
primary_region = "arn"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  CS_PUBLIC_DEMO = "1"
  CS_NO_PUBLISH = "1"
  CS_DEMO_SIGNERS = "1"
  CS_LIVE_BUDGET = "30"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service]]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/live"
